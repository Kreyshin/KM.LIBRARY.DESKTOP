services:
  karma-library:
    build:
      context: .
      dockerfile: Dockerfile.lan
    container_name: karma-library-lan
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3344
      KARMA_MODE: lan
      KARMA_DATA_DIR: /data
      KARMA_STATIC_DIR: /app/web
      DATABASE_URL: file:/data/library.sqlite
    volumes:
      - karma_library_data:/data
    ports:
      - "3344:3344"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3344/api/system/status"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  karma_library_data:
